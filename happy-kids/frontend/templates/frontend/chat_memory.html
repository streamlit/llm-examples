{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="{% static 'frontend/img/logo_happy_kids.png' %}">
        <title>Happy Kids | My Chat History</title>

        <link rel="stylesheet" href="{% static 'frontend/css/lulu_styles.css' %}">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    </head>
    <body>
        <div class="container">
            {% include 'sidebar.html' %}

            <main class="content">
                {% include 'header.html' %}
            
                <div class="class-container">
                
                    <!-- Adicionado chat-history -->
                    <div class="class-page-content">
                        {% for conversa in conversas %}
                            <div class="message user-message">
                                {{ conversa.user_message }}
                                <h5>{{ conversa.date_time }}</h5>
                            </div>
                            <div class="message bot-message">
                                {{ conversa.chat_message | safe}}
                                <h5>{{ conversa.date_time }}</h5>
                            </div>
                        {% endfor %}
                    </div>
                
                </div>
                
            </main>
        </div>

    </body> 
</html>
