{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" href="{% static 'frontend/img/logo_happy_kids.png' %}">
    <title>Happy Kids | Surprise Me</title>
    <link rel="stylesheet" href="{% static 'frontend/css/lulu_styles.css' %}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>


</head>

<body>
    <div class="container">
        {% include 'sidebar.html' %}

        <main class="content">
            {% include 'header.html' %}
            

            <div id="button-container" style= "display:flex">
                <img src="{% static 'frontend/img/lulu_bot_novo.png' %}" class="img-lulu-onboarding" alt="Lulu">
                <div class="start-onboarding-message">
                    <h3>Surprise me</h3>
                    <p>Self-test: Am I boring</p>
                
                </div>
                <button id="start-onboarding">Lëtz Start!</button>
            </div>

            <div id="onboarding-container" class="onboarding-container" style="display: none">
                <h1 id="step-title"></h1>
                <p id="question-text"></p>
                
                <div id="answer-options" class="answer-options">
                    <!-- As opções de resposta serão inseridas aqui dinamicamente -->
                </div>
            
                <div class="onboarding-buttons">
                    <button class="skip" onclick="hideOnboarding()">Skip</button>
                    <button class="next" onclick="nextQuestion()">Next</button>
                    
                </div>
            </div>
  
        </main>
    </div>

    <!-- Funções para Onboarding-->
    <script>
 
        // Função para mostrar o container de onboarding
        document.getElementById("start-onboarding").addEventListener("click", function() {
            document.getElementById("onboarding-container").style.display = "block";
            document.getElementById("button-container").style.display = "none";
        });
    
        // Função para esconder o container de onboarding (caso o usuário clique em "Pular")
        function hideOnboarding() {
            document.getElementById("onboarding-container").style.display = "none";
            document.getElementById("button-container").style.display = "flex";
        }
    
        let questions = [];
        let currentQuestionIndex = 0;
    
        // Função para carregar as perguntas e opções
        document.getElementById("start-onboarding").addEventListener("click", function() {
            fetch("/app/am-i-boring-data/")  // Endpoint que retorna as perguntas não respondidas
                .then(response => response.json())
                .then(data => {
                    questions = data.questions;
                    if (questions.length > 0) {
                        currentQuestionIndex = 0;
                        showQuestion();
                        document.getElementById("onboarding-container").style.display = "block";
                    } else {
                        hideOnboarding();  // Se todas as perguntas foram respondidas, esconde o onboarding
                    }
                })
                .catch(error => console.error("Erro ao carregar onboarding:", error));
        });
    
        // Função para exibir a pergunta e suas opções
        function showQuestion() {
            if (currentQuestionIndex < questions.length) {
                const question = questions[currentQuestionIndex];
                document.getElementById("step-title").textContent = `Step ${currentQuestionIndex + 1} of ${questions.length}`;
                document.getElementById("question-text").textContent = question.question;
    
                // Limpar opções anteriores
                const answerOptionsContainer = document.getElementById("answer-options");
                answerOptionsContainer.innerHTML = '';
    
                // Verificar se existem opções para essa pergunta
                if (question.options.length > 0) {
                    question.options.forEach(option => {
                        const optionButton = document.createElement('button');
                        optionButton.textContent = option;
                        optionButton.classList.add('option-button');
                        optionButton.onclick = () => handleOptionClick(option, question.id);
                        answerOptionsContainer.appendChild(optionButton);
                    });
                } else {
                    // Caso não haja opções, adicionar um campo de texto
                    const textInput = document.createElement('input');
                    textInput.type = 'text';
                    textInput.placeholder = 'Digite sua resposta...';
                    textInput.id = `text-answer-${question.id}`;  // Adicionar um ID único por pergunta
                    textInput.addEventListener('keydown', function(event) {
                        if (event.key === 'Enter') {  // Quando pressionar Enter
                            handleTextAnswer(question.id);  // Salva a resposta e avança para a próxima
                        }
                    });
                    answerOptionsContainer.appendChild(textInput);
                }
            } else {
                hideOnboarding(); 
            }
        }
    
        // Função para avançar para a próxima pergunta
        function nextQuestion() {
            const currentQuestion = questions[currentQuestionIndex];
        
            // Verificar se a pergunta atual é de resposta aberta (campo de texto)
            if (currentQuestion.options.length === 0) {
                const textAnswer = document.getElementById(`text-answer-${currentQuestion.id}`);
                if (textAnswer && textAnswer.value.trim() !== "") {
                    handleTextAnswer(currentQuestion.id); // Salva a resposta antes de avançar
                } else {
                    console.warn("Nenhuma resposta foi inserida!");
                    return; // Impede que avance sem uma resposta
                }
            } else {
                currentQuestionIndex++; // Avança para a próxima pergunta
                showQuestion(); // Exibe a próxima pergunta
            }
        }
    
        // Função para lidar com o clique nas opções
        function handleOptionClick(option, questionId) {
            console.log('Opção escolhida:', option);
            console.log('ID da Pergunta:', questionId);
    
            // Preparar os dados para enviar ao backend
            const data = {
                question_id: questionId,
                answer: option
            };
    
            // Enviar os dados via requisição POST para salvar no banco
            fetch("/app/save-am-i-boring-answer/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": '{{ csrf_token }}'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                console.log("Resposta salva com sucesso:", result);
                // Avançar para a próxima pergunta
                nextQuestion();
            })
            .catch(error => {
                console.error("Erro ao salvar a resposta:", error);
            });
        }
    
        // Função para salvar a resposta de um campo de texto
        function handleTextAnswer(questionId) {
            const textAnswer = document.getElementById(`text-answer-${questionId}`).value.trim();
            
            if (textAnswer === "") {
                console.warn("The text reply is empty. It will not be sent.");
                return;
            }
        
            console.log('Text Answer:', textAnswer);
            console.log('Question ID:', questionId);
        
            const data = {
                question_id: questionId,
                answer: textAnswer
            };
        
            fetch("/app/save-am-i-boring-answer/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": '{{ csrf_token }}'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                console.log("Resposta salva com sucesso:", result);
                currentQuestionIndex++; // Só avança após salvar no banco
                showQuestion();
            })
            .catch(error => {
                console.error("Erro ao salvar a resposta:", error);
            });
        }
    </script>

    
    
    

</body> 
</html>
