{% load static %}
<head>

    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'frontend/css/sidebar_styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

</head>

<aside class="sidebar">
    <div class="menu-icon" onclick="toggleMenu()">
        <a><i class="fas fa-bars"></i> <span>Menu</span></a>
    </div>
    <ul id="menu">
        <li class="{% if request.path == '/app/' %}selected{% endif %}">
            <a href="/app/"><i class="fas fa-home"></i> <span>Home</span></a>
        </li>
        {% if not request.user.is_authenticated %}
            <li class="{% if request.path == '/accounts/login/' %}selected{% endif %}">
                <a href="/accounts/login/"><i class="fas fa-sign-in-alt"></i> <span>Login</span></a>
            </li>
        {% endif %}
        {% if request.user.is_authenticated %}

            {% if request.user.is_staff %}
                <li class="{% if '/app/adm/' in request.path %}selected{% endif %}">
                    <a href="/app/adm/users_page"><i class="fas fa-user-shield"></i> <span>Adm</span></a>
                </li>

            {% endif %}
            <li class="{% if request.path == '/accounts/logout/' %}selected{% endif %}">
                <a href="/accounts/logout/"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
            </li>
        {% endif %}
    </ul>
    <script src="{% static 'frontend/js/scripts_sidebar.js' %}"></script>
</aside>
