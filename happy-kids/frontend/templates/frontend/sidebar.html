{% load static %}
<head>

    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'frontend/css/sidebar_styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>

<aside class="sidebar">
            
    <div class="menu-icon" onclick="toggleMenu()">
        <i class="fas fa-bars"></i>
    </div>
    
    <ul id="menu" style="display: none;">
        <li class="{% if request.path == '/app/' %}selected{% endif %}">
            <a href="/app/">Home</a>
        </li>
        <li class="{% if request.path == '/app/lulu' %}selected{% endif %}">
            <a href="/app/lulu">Lulu</a>
        </li>
        <li class="{% if request.path == '/app/users_page' %}selected{% endif %}">
            <a href="/app/users_page">Users</a>
        </li>
        <li class="{% if request.path == '/app/trainingFiles' %}selected{% endif %}">
            <a href="/app/trainingFiles">Training Files</a>
        </li>
        <li class="{% if request.path == '/accounts/logout/' %}selected{% endif %}">
            <a href="/accounts/logout/">Logout</a>
        </li>
    </ul>

    <div class="lulu_icon">
        <img src="{% static 'frontend/img/logo_happy_kids_2.png' %}" alt="Image Description" class="starters-image" />
    </div>

    <script src="{% static 'frontend/js/scripts_sidebar.js' %}"></script>

</aside>
