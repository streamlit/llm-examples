{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lulu</title>

    <link rel="stylesheet" href="{% static 'frontend/css/lulu_styles.css' %}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        {% include 'sidebar.html' %}

        <main class="content">
            {% include 'header.html' %}
          
            <div class="chat-container">
                <h1>Hi, {{ user.first_name }}</h1>
            
                <div class="quick-suggestions" id="quick-suggestions">
                    <span class="suggestion">Teach me something cool in 1 minute!</span>
                    <span class="suggestion">Give me a quick tip to be more confident!</span>
                    <span class="suggestion">Help me focus for 10 minutes!</span>
                    <span class="suggestion">Cheer me up with something positive!</span>
                </div>

                <!-- Adicionado chat-history -->
                <div class="chat-history" id="chat-history"></div>
            
                <div class="input-container">
                    <form id="ai-form" method="POST" onsubmit="hideSuggestions()">
                        <input type="text" id="question" name="question" placeholder="Type your message..." required />
                        <button id="send-button">
                            <span>&#8594;</span> 
                        </button>
                    </form>
                </div>
            </div>
            
        
            
        </main>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("ai-form");
            const input = document.getElementById("question");
        
            input.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    event.preventDefault(); // Impede a quebra de linha no input
                    form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true })); // Simula clique no botão de envio
                }
            });
        });
    </script>

    <script>
        function hideSuggestions() {
            document.getElementById('quick-suggestions').classList.add('hidden');
        }
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("ai-form");
            const input = document.getElementById("question");
            const suggestions = document.querySelectorAll(".suggestion");
        
            // Permitir envio com Enter no campo de input
            input.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
                }
            });
        
            // Permitir envio imediato ao clicar em uma sugestão
            suggestions.forEach(suggestion => {
                suggestion.addEventListener("click", function () {
                    input.value = this.innerText; // Define a sugestão como entrada
                    form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true })); // Envia automaticamente
                });
            });
        });

    </script>

    <script>
        document.getElementById('ai-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const url = "{% url 'lulu' %}";
            const questionInput = document.getElementById('question');
            const question = questionInput.value.trim();
            const chatHistory = document.getElementById('chat-history');

            if (question === "") return;

            // Adiciona a pergunta do usuário ao chat
            const userMessage = document.createElement("div");
            userMessage.classList.add("message", "user-message");
            userMessage.innerText = question;
            chatHistory.appendChild(userMessage);
            questionInput.value = "";

            // Scroll para a última mensagem
            chatHistory.scrollTop = chatHistory.scrollHeight;

            const form_data = new FormData();
            form_data.append("question", question);

            try {
                const response = await fetch(url, {
                    method: "POST",
                    body: form_data
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let botMessage = document.createElement("div");
                botMessage.classList.add("message", "bot-message");
                chatHistory.appendChild(botMessage);

                // Processamento do streaming de resposta
                function processStream({ done, value }) {
                    if (done) return;
                    botMessage.innerText += decoder.decode(value);
                    reader.read().then(processStream);
                }

                reader.read().then(processStream);
            } catch (error) {
                console.error("Erro ao obter resposta:", error);
                let errorMessage = document.createElement("div");
                errorMessage.classList.add("message", "error-message");
                errorMessage.innerText = "Erro ao obter resposta. Tente novamente.";
                chatHistory.appendChild(errorMessage);
            }
        });

        
    </script>

</body> 
</html>
